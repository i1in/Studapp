<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <header class="header">
        <div class="header__wrapper">
            <div class="header__left">
                <a class="header__logo-link" href="#">
                    <p class="header__logo">Studapp</p>
                </a>
            </div>
        </div>
    </header>
    <div class="page">
        <div class="container">
            <div class="login-wrapper">
                <div class="login-image">
                    <img src="img/login_image.jpg" alt="login_image" />
                </div>
                <div class="login-form__main">
                    <div class="login-form__labels">
                        <p class="login-form__title">Логин</p>
                        <p class="login-form__subtitle">Вход в форум для студентов</p>
                    </div>
                    <form class="login-form">
                        <input type="text" placeholder="Email" />
                        <input type="password" placeholder="Пароль" />
                        <button type="submit">Войти</button>
                        <p class="login_tip">
                            <span style="color: red;">(!)</span>
                            Используйте выданные данные
                        </p>
                    </form>
                </div>
            </div>
        </div>
        <footer class="footer">
            <p class="footer">
                © 2025
            </p>
        </footer>
    </div>
</body>

</html>
