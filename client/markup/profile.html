<!DOCTYPE html>
<html lang="en">

<head>

                        <g id="SVGRepo_tracerCarrier" strokeLinecap="round" strokeLinejoin="round"></g>

                            </path>
                        </g>
                    </svg>
                </span>
                <span class="label">Лента</span>
            </a>
            <a href='/' class="profile-avatar menu-item">
                <div class="profile-avatar__wrapper">
                    <img class="profile-avatar__img rounded" src="img/defaultavatar.png" alt="Аватар профиля" />
                </div>
                <span class="label">Профиль</span>
            </a>
        </nav>

        <main class="content">
            <div class="user-section">
                <div class="user-profile student-bg">
                    <div class="user-bio">
                        <div class="user-avatar">
                            <img class="user-avatar__img rounded" src="img/defaultavatar.png" alt='user avatar' />
                        </div>
                        <div class="user-bio__block">
                            <p class="user-names">
                                Амир Ихсанов
                            </p>
                            <p class="user-status__text" contenteditable="true">
                                She's WDC, but I'm Hamilton
                            </p>
                        </div>
                        <div class="user-additional">
                            <div class="user-additional__block">
                                <p class="user-additional__label">
                                    Статус
                                </p>
                                <span class="user-role student">
                                    Студент
                                </span>
                            </div>
                            <div class="user-additional__block">
                                <p class="user-additional__label">
                                    <span class="icon">
                                        @
                                    </span>
                                    Юзернейм
                                </p>
                                <span class="user-additional__text">
                                    emptymethod
                                </span>
                            </div>
                            <div class="user-additional__block">
                                <p class="user-additional__label">
                                    <span class="icon">
                                        <svg width="16px" height="18px" viewBox="0 -2.4 26.40 28.80"
                                            xmlns="http://www.w3.org/2000/svg" fill="currentColor" stroke="#000000"
                                            stroke-width="0.00024000000000000003" transform="matrix(1, 0, 0, 1, 0, 0)">
                                            <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                                            <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"
                                                stroke="#CCCCCC" stroke-width="0.048"></g>
                                            <g id="SVGRepo_iconCarrier">
                                                <rect x="0" fill="none" width="24" height="24"></rect>
                                                <g>
                                                    <path
                                                        d="M2 19h20v3H2zM12 2L2 6v2h20V6M17 10h3v7h-3zM10.5 10h3v7h-3zM4 10h3v7H4z">
                                                    </path>
                                                </g>
                                            </g>
                                        </svg>
                                    </span>
                                    Факультет
                                </p>
                                <span class="user-additional__text">
                                    ИВМИиТ
                                </span>
                            </div>
                        </div>
                    </div>
                    <div class="follow-button">
                        <button class="follow-button__wrapper followed">
                            <p class="follow-button__title">
                                + Подписаться
                            </p>
                        </button>
                    </div>
                </div>
                <div class="post-upload">
                    <p class="section-title">
                        Новая заметка
                    </p>

                            <div class="upload-inputs__row">
                                <input type="text" class="text-input" placeholder="Введите описание">
                                <label class="file-input-label">
                                    <svg width="24px" height="24px" viewBox="0 0 24 24" fill="none"
                                        xmlns="http://www.w3.org/2000/svg">

                                        <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round">
                                        </g>
                                        <g id="SVGRepo_iconCarrier">
                                            <path fill-rule="evenodd" clip-rule="evenodd"

                        </div>
                        <div class="post-button">
                            <button class="post-button__wrapper" disabled>
                                <p class="post-button__text">

                            </button>

                    </div>
